[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mris"
version = "0.1.0"
description = "Maritime Regulatory Intelligence Suite — deterministic legal-rule engine (Blueprint v2.0)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["mris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
