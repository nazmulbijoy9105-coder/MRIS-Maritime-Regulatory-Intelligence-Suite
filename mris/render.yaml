# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service: FastAPI backend (serves the premium UI at "/").
services:
  - type: web
    name: mris
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mris.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
